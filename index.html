<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Spaz-on-github</title>
    <link rel="stylesheet" href="styles.css">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<!-- MATRIX RAIN -->
<canvas id="matrix-rain"></canvas>

<!-- PARTICLES -->
<canvas id="particles"></canvas>

<!-- GLITCH OVERLAY -->
<div class="glitch-overlay"></div>

<!-- TERMINAL WINDOW -->
<div class="cyber-terminal">

    <!-- HEADER -->
    <div class="terminal-header">
        <div class="terminal-controls">
            <div class="control close"></div>
            <div class="control minimize"></div>
            <div class="control maximize"></div>
        </div>

        <div class="terminal-title glitch-text">
            SPAZMA ON GITHUB
            <div class="signal-indicator">
                <div class="signal-dot"></div>
                <div class="signal-dot"></div>
                <div class="signal-dot"></div>
            </div>
        </div>
    </div>

    <!-- BODY -->
    <div class="terminal-body">

        <!-- BOOT SEQUENCE -->
        <div class="boot-sequence">
            <div class="boot-line">[BOOT] Initializing cyber-kernel...</div>
            <div class="boot-line">[BOOT] Loading neon modules...</div>
            <div class="boot-line">[BOOT] Establishing uplink...</div>
            <div class="boot-line">[BOOT] Checking GitHub API...</div>
            <div class="boot-line">[BOOT] System ready.</div>
			<div class="boot-line boot-fetch">[BOOT] Fetching projects...</div>

        </div>

		<div class="terminal-content"></div>

		<!-- SCREENSHOT PREVIEW -->
		<div class="screenshot-preview">
			<img id="screenshot-img" src="" alt="preview">
			<div class="screenshot-glitch"></div>
		</div>

		<a href="https://github.com/spazma" target="_blank">
			<img src="logo.png" class="terminal-logo" alt="logo">
		</a>

    </div>
	
</div>

<div id="visits-counter" class="visits-counter">visits: ...</div>

<script src="script.js"></script>

<!-- BUY ME A COFFEE WIDGET - wklej tutaj (przed zamknięciem body) -->
<script data-name="BMC-Widget" data-cfasync="false"
  src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
  data-id="spazma"
  data-description="Support me on Buy me a coffee!"
  data-message="Hey there! If you enjoy what I do, feel free to fuel me with a coffee ☕🤟"
  data-color="#FF813F"
  data-position="Right"
  data-x_margin="18"
  data-y_margin="18">
</script>

<!-- Fallback jeśli użytkownik ma wyłączony JS -->
<noscript>
  <div style="position:fixed;bottom:18px;right:18px;z-index:99999;">
    <a href="https://www.buymeacoffee.com/spazma" target="_blank" rel="noopener">Support me on Buy Me a Coffee</a>
  </div>
</noscript>

<!-- Krótki skrypt pomocniczy: upewnia się, że iframe/widget jest nad nakładkami -->
<script>
  window.addEventListener('load', function(){
    setTimeout(function(){
      // podnieś z-index dla iframeów BuyMeACoffee (jeśli istnieją)
      document.querySelectorAll('iframe[src*="buymeacoffee"], iframe[src*="buymeacoffee"]').forEach(function(f){
        f.style.zIndex = 999999;
      });
      // jeśli widget wstrzykuje elementy z klasami, spróbuj podnieść ich z-index
      var possibleSelectors = ['.bmc-wbtn', '.bmc-button', '.bmc-floating'];
      possibleSelectors.forEach(function(sel){
        document.querySelectorAll(sel).forEach(function(el){ el.style.zIndex = 999999; });
      });
    }, 800);
  });
</script>

<script>
fetch("https://githubglowne.score-3e6.workers.dev")
  .then(r => r.json())
  .then(data => {
    document.getElementById("visits-counter").innerText = "visits: " + data.count;
  })
  .catch(err => {
    console.error("Counter error:", err);
  });
</script>

</body>
</html>
